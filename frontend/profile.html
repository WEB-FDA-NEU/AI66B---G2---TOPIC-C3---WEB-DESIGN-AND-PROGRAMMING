<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homestay Booking — Hồ sơ cá nhân</title>
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>

<site-header active="profile"></site-header>

<main class="page container profile-page">

  <div class="section-head">
    <div>
      <h1>Hồ sơ cá nhân</h1>
      <p>Quản lý thông tin tài khoản của bạn.</p>
    </div>
  </div>

  <div class="profile-layout">

    <!-- ============ THÔNG TIN CÁ NHÂN: ảnh đại diện (trái) + các ô thông tin xếp ngang (phải) ============ -->
    <section class="form-card form-card--flat profile-card--main">
      <h3>Thông tin cá nhân</h3>

      <div class="profile-main">

        <!-- Avatar -->
        <div class="profile-avatar">
          <img class="profile-avatar__img" src="img/avatar_default.jpg" alt="Ảnh đại diện" width="112" height="112">
          <div class="profile-avatar__upload">
            <label class="btn btn--outline btn--sm" for="avatar">Đổi ảnh</label>
            <input type="file" id="avatar" name="avatar" accept="image/png,image/jpeg,image/webp" hidden>
            <p class="field__hint">JPEG, PNG hoặc WebP, tối đa 5MB.</p>
          </div>
        </div>

        <!-- Form: 2 cột trên desktop, 1 cột trên mobile -->
        <form id="profile-form">
          <div class="form-grid">
            <label class="field">
              <span class="field__label">Họ và tên</span>
              <input class="input" type="text" name="display_name">
              <span class="field__error"></span>
            </label>

            <label class="field">
              <span class="field__label">Số điện thoại</span>
              <input class="input" type="tel" name="phone">
              <span class="field__error"></span>
            </label>

            <label class="field field--full">
              <span class="field__label">Email</span>
              <input class="input" type="email" name="email">
              <span class="field__hint">Dùng email này để đăng nhập.</span>
              <span class="field__error"></span>
            </label>
          </div>

          <div class="profile-actions">
            <button class="btn btn--primary" type="submit">Lưu thay đổi</button>
          </div>
        </form>

      </div>
    </section>

    <!-- ============ ĐỔI MẬT KHẨU ============ -->
    <section class="form-card form-card--flat">
      <h3>Đổi mật khẩu</h3>
      <form class="mt-3" id="password-form">
        <div class="form-grid">
          <label class="field field--full">
            <span class="field__label">Mật khẩu hiện tại</span>
            <input class="input" type="password" name="current_password">
            <span class="field__error"></span>
          </label>

          <label class="field">
            <span class="field__label">Mật khẩu mới</span>
            <input class="input" type="password" name="new_password">
            <span class="field__hint">Tối thiểu 8 ký tự.</span>
            <span class="field__error"></span>
          </label>

          <label class="field">
            <span class="field__label">Nhập lại mật khẩu mới</span>
            <input class="input" type="password" name="confirm_password">
            <span class="field__error"></span>
          </label>
        </div>

        <div class="profile-actions">
          <button class="btn btn--primary" type="submit">Đổi mật khẩu</button>
        </div>
      </form>
    </section>

    <!-- ============ TRỞ THÀNH HOST ============
         Chỉ dành cho khách hàng (role 'user') hoặc khách chưa đăng nhập.
         Host đã là host rồi, admin không cần thấy lời mời này — ẩn bằng
         script cuối trang (xem role === 'host' || role === 'admin'). -->
    <section class="form-card form-card--flat" id="become-host-section">
      <h3>Bạn có homestay muốn cho thuê?</h3>
      <p class="mt-3 text-muted">Đăng ký làm host để bắt đầu quản lý homestay của riêng bạn.</p>
      <div class="profile-actions">
        <a class="btn btn--primary" href="host-register.html">Trở thành Host</a>
      </div>
    </section>

  </div>

</main>

<site-footer></site-footer>
<div id="toast" role="status"></div>

<script type="module" src="js/pages/profile.js"></script>
</body>
</html>
