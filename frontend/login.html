<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập — Homestay Booking</title>

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

<site-header></site-header>

  <!-- 2. Bao bọc form trong khối `.form-card` có sẵn của components.css -->
  <main class="container page">
    <div class="form-card">
      <a class="text-muted underline" href="index.html">← Quay lại trang chủ</a>
      <div class="login-header stack mb-3">
        <h1>Đăng nhập</h1>
        <p class="text-muted">Đăng nhập để đặt phòng, xem lịch sử đặt phòng và quản lý hồ sơ của bạn.</p>
      </div>

      <form id="login-form" class="stack" novalidate>
        
        <!-- Field Email -->
        <div class="field">
          <label class="field__label" for="email">Địa chỉ email</label>
          <input class="input" id="email" name="email" type="email" required autocomplete="email">
          <p class="field__error"></p>
        </div>

        <!-- Field Mật khẩu -->
        <div class="field">
          <label class="field__label" for="password">Mật khẩu</label>
          <input class="input" id="password" name="password" type="password" required minlength="8" autocomplete="current-password">
          <p class="field__error"></p>
        </div>

        <!-- Thêm nút .btn--block để nút trải dài đẹp mắt -->
        <button class="btn btn--primary btn--block" type="submit">Đăng nhập</button>

        <p class="field__hint text-center">
          Chưa có tài khoản? <a class="text-primary" href="register.html">Đăng ký ngay</a>
        </p>
      </form>

      <!-- Tài khoản demo: bấm để tự điền, tránh nhầm khi test (mock/users.json) -->
      <div class="demo-accounts">
        <p class="demo-accounts__title">Tài khoản demo</p>
        <div class="demo-accounts__list">
          <button type="button" class="btn btn--sm demo-accounts__item" data-demo-email="huy@test.com">
            huy@test.com <span class="demo-accounts__role">Khách hàng</span></button>
          <button type="button" class="btn btn--sm demo-accounts__item" data-demo-email="host@test.com">
            host@test.com <span class="demo-accounts__role">Chủ nhà (Host)</span></button>
          <button type="button" class="btn btn--sm demo-accounts__item" data-demo-email="admin@test.com">
            admin@test.com <span class="demo-accounts__role">Quản trị (Admin)</span></button>
        </div>
        <p class="demo-accounts__hint">Mật khẩu chung: 12345678 — bấm vào một dòng để tự điền.</p>
      </div>
    </div>
  </main>

<site-footer></site-footer>
<div id="toast" role="status"></div>

  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
