<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bảng điều khiển chủ nhà — Homestay Booking</title>
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<style>
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-3); margin-bottom: var(--sp-5); }
  .stat-card { padding: var(--sp-4); background: var(--c-bg); border: 1px solid var(--c-border); border-radius: var(--radius); }
  .stat-card__num { font-size: 28px; font-weight: 700; color: var(--c-primary); }
  .stat-card__label { color: var(--c-muted); font-size: 14px; margin-top: 4px; }
  .quick-links { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-bottom: var(--sp-5); }
  @media (max-width: 1023px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<site-header active="host"></site-header>

<main class="container page">
  <div class="section-head"><div><h1>Bảng điều khiển chủ nhà</h1><p>Tổng quan homestay, phòng và đặt phòng của bạn.</p></div></div>

  <div class="stat-grid" id="stats">
    <div class="stat-card"><div class="skeleton-card" style="aspect-ratio:auto;height:56px"></div></div>
    <div class="stat-card"><div class="skeleton-card" style="aspect-ratio:auto;height:56px"></div></div>
    <div class="stat-card"><div class="skeleton-card" style="aspect-ratio:auto;height:56px"></div></div>
    <div class="stat-card"><div class="skeleton-card" style="aspect-ratio:auto;height:56px"></div></div>
  </div>

  <div class="quick-links">
    <a class="btn btn--primary" href="host-homestay-form.html">+ Thêm homestay</a>
    <a class="btn btn--outline" href="host-homestays.html">Quản lý homestay</a>
    <a class="btn btn--outline" href="host-rooms.html">Quản lý phòng</a>
    <a class="btn btn--outline" href="host-bookings.html">Quản lý đặt phòng</a>
  </div>

  <div class="section-head"><div><h2>Đặt phòng gần đây</h2><p>5 đặt phòng mới nhất trên các homestay của bạn</p></div></div>
  <div id="recent"><p class="text-muted">Đang tải...</p></div>
</main>

<site-footer></site-footer>
<script type="module" src="js/pages/host-dashboard.js"></script>
</body>
</html>
